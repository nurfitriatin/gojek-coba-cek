<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday - Ivan Ramadan</title>


    <!-- =====================================================
         FONT
    ====================================================== -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">


<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}


/* =====================================================
   BODY
===================================================== */

body {

    min-height: 100vh;

    font-family:
        "Plus Jakarta Sans",
        sans-serif;

    color: #f5f0df;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(214, 176, 61, 0.18),
            transparent 28%
        ),
        radial-gradient(
            circle at 85% 90%,
            rgba(214, 176, 61, 0.13),
            transparent 28%
        ),
        linear-gradient(
            135deg,
            #030303 0%,
            #0b0b0b 42%,
            #151209 72%,
            #342706 100%
        );
}


/* =====================================================
   PAGE
===================================================== */

.page {

    width: 100%;
    height: 100vh;

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 20px;

    position: relative;
}


/* =====================================================
   BACKGROUND DECORATION
===================================================== */

.page::before {

    content: "";

    position: fixed;

    width: 420px;
    height: 420px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(218, 180, 65, 0.12),
            transparent 70%
        );

    top: -230px;
    left: -180px;

    pointer-events: none;
}

.page::after {

    content: "";

    position: fixed;

    width: 400px;
    height: 400px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(218, 180, 65, 0.09),
            transparent 70%
        );

    bottom: -230px;
    right: -180px;

    pointer-events: none;
}


/* =====================================================
   MAIN CARD
===================================================== */

.birthday-card {

    position: relative;

    width: min(
        980px,
        calc(100vw - 40px)
    );

    height: min(
        650px,
        calc(100vh - 40px)
    );

    min-height: 600px;

    overflow: hidden;

    border-radius: 28px;

    background:

        radial-gradient(
            circle at 50% 0%,
            rgba(218, 180, 65, 0.10),
            transparent 40%
        ),

        linear-gradient(
            145deg,
            #111111 0%,
            #090909 48%,
            #17130a 100%
        );

    border:
        1px solid
        rgba(218, 180, 65, 0.72);

    box-shadow:

        0 25px 70px
        rgba(0, 0, 0, 0.65),

        0 0 40px
        rgba(218, 180, 65, 0.10);

    z-index: 5;
}


/* =====================================================
   INNER BORDER
===================================================== */

.birthday-card::before {

    content: "";

    position: absolute;

    inset: 12px;

    border:
        1px solid
        rgba(218, 180, 65, 0.18);

    border-radius: 20px;

    pointer-events: none;

    z-index: 50;
}


/* =====================================================
   SMALL DECORATION
===================================================== */

.gold-dot {

    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #d8b44a;

    box-shadow:
        0 0 10px
        rgba(216, 180, 74, 0.6);

    z-index: 5;
}

.dot-1 {
    top: 105px;
    left: 65px;
}

.dot-2 {
    top: 165px;
    right: 90px;
}

.dot-3 {
    bottom: 90px;
    left: 110px;
}

.dot-4 {
    bottom: 125px;
    right: 80px;
}


/* =====================================================
   NAVIGATION
===================================================== */

.top-nav {

    position: relative;

    width: 100%;

    height: 70px;

    display: flex;

    align-items: center;

    justify-content: flex-end;

    gap: 30px;

    padding: 0 45px;

    border-bottom:
        1px solid
        rgba(218, 180, 65, 0.14);

    z-index: 100;
}


/* =====================================================
   PAGE NUMBER
===================================================== */

.page-number {

    position: absolute;

    left: 35px;
    top: 20px;

    padding:
        7px 13px;

    background:
        rgba(216, 180, 74, 0.12);

    color: #d8b44a;

    border:
        1px solid
        rgba(216, 180, 74, 0.35);

    border-radius: 20px;

    font-size: 10px;

    font-weight: 800;

    letter-spacing: 1px;
}


/* =====================================================
   NAV LINK
===================================================== */

.nav-link {

    color:
        rgba(245, 240, 223, 0.65);

    text-decoration: none;

    font-size: 10px;

    font-weight: 600;

    transition: .25s;
}

.nav-link:hover {

    color: #d8b44a;

    transform:
        translateY(-2px);
}


/* =====================================================
   MENU
===================================================== */

.menu-button {

    border: none;

    background: transparent;

    color: #d8b44a;

    font-size: 20px;

    cursor: pointer;

    transition: .25s;
}

.menu-button:hover {

    transform:
        rotate(10deg);

    color: #f0d477;
}


/* =====================================================
   CONTENT
===================================================== */

.content {

    position: relative;

    width: 100%;

    height:
        calc(100% - 70px);

    padding:
        35px 60px 40px;

    display: flex;

    flex-direction: column;

    align-items: center;

    z-index: 10;
}


/* =====================================================
   GOLD HEADER DECORATION
===================================================== */

.header-line {

    width: 70px;

    height: 3px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #d8b44a,
            transparent
        );

    margin-bottom: 17px;

    border-radius: 50%;
}


/* =====================================================
   TITLE AREA
===================================================== */

.title {

    position: relative;

    width: 100%;

    text-align: center;

    margin-top: 5px;

    z-index: 5;
}


/* =====================================================
   HAPPY
===================================================== */

.happy {

    font-family:
        "Baloo 2",
        cursive;

    color: #f5f0df;

    font-size:
        clamp(65px, 8vw, 88px);

    font-weight: 800;

    line-height: .78;

    letter-spacing: -3px;

    transform:
        rotate(-2deg);

    text-shadow:
        0 5px 25px
        rgba(0,0,0,.4);
}


/* =====================================================
   BIRTHDAY
===================================================== */

.birthday {

    margin-top: 13px;

    font-family:
        "Baloo 2",
        cursive;

    color: #d8b44a;

    font-size:
        clamp(58px, 7vw, 80px);

    font-weight: 800;

    line-height: .78;

    letter-spacing: -3px;

    transform:
        rotate(-2deg);

    text-shadow:
        0 5px 25px
        rgba(216,180,74,.10);
}


/* =====================================================
   UNDERLINE
===================================================== */

.underline {

    width: 70px;

    height: 4px;

    margin:
        15px auto 0;

    background: #d8b44a;

    border-radius: 50%;

    transform:
        rotate(-3deg);

    box-shadow:
        0 0 10px
        rgba(216,180,74,.3);
}


/* =====================================================
   DECORATIVE CORNERS
===================================================== */

.corner {

    position: absolute;

    color: #d8b44a;

    font-family: Georgia, serif;

    opacity: .75;

    z-index: 8;
}

.corner-left {

    left: 65px;
    top: 140px;

    font-size: 25px;

    transform:
        rotate(-15deg);
}

.corner-right {

    right: 65px;
    top: 135px;

    font-size: 18px;

    transform:
        rotate(12deg);
}


/* =====================================================
   GOLD NAME
===================================================== */

.name-label {

    position: relative;

    width: 340px;

    min-height: 55px;

    margin:
        25px auto 0;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #e2c15b,
            #b88b26
        );

    color: #15120b;

    border-radius: 50px;

    font-family:
        "Baloo 2",
        cursive;

    font-size: 32px;

    font-weight: 800;

    line-height: 1;

    box-shadow:
        0 10px 25px
        rgba(0,0,0,.35),

        0 0 20px
        rgba(216,180,74,.10);

    transform:
        rotate(-1deg);

    z-index: 20;
}


/* =====================================================
   MESSAGE
===================================================== */

.message {

    width: 600px;

    max-width: 80%;

    margin:
        22px auto 0;

    color:
        rgba(245,240,223,.78);

    text-align: center;

    font-size: 14px;

    line-height: 1.7;

    font-weight: 500;

    z-index: 15;
}


/* =====================================================
   MESSAGE HIGHLIGHT
===================================================== */

.message::before {

    content: "";

    display: block;

    width: 45px;

    height: 1px;

    background: #d8b44a;

    margin:
        0 auto 14px;

    opacity: .7;
}


/* =====================================================
   STICKY NOTE
===================================================== */

.sticky-note {

    position: absolute;

    right: 52px;

    top: 285px;

    width: 95px;

    height: 115px;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        linear-gradient(
            145deg,
            #f3e4b0,
            #d9bd70
        );

    color: #18150d;

    font-family:
        "Baloo 2",
        cursive;

    font-size: 12px;

    font-weight: 700;

    line-height: 1.15;

    text-align: center;

    transform:
        rotate(5deg);

    box-shadow:
        0 12px 25px
        rgba(0,0,0,.35);

    z-index: 30;
}


/* =====================================================
   NOTE FOLD
===================================================== */

.sticky-note::after {

    content: "";

    position: absolute;

    right: 0;
    bottom: 0;

    width: 0;
    height: 0;

    border-left:
        17px solid transparent;

    border-top:
        17px solid
        rgba(100,80,30,.15);
}


/* =====================================================
   BOTTOM AREA
   FOTO DIHAPUS
===================================================== */

.bottom-area {

    display: none;
}


/* =====================================================
   BOTTOM CONTROLS
===================================================== */

.bottom-controls {

    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;

    height: 105px;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        linear-gradient(
            180deg,
            rgba(12,12,12,.2),
            #090909
        );

    border-top:
        1px solid
        rgba(218,180,65,.14);

    z-index: 40;
}


/* =====================================================
   NEXT BUTTON
===================================================== */

.next-button {

    width: 165px;

    height: 40px;

    border:
        1px solid
        rgba(216,180,74,.55);

    border-radius: 25px;

    background:
        linear-gradient(
            135deg,
            #d8b44a,
            #a77d20
        );

    color: #14120c;

    font-family:
        "Plus Jakarta Sans",
        sans-serif;

    font-size: 10px;

    font-weight: 800;

    letter-spacing: 1px;

    cursor: pointer;

    box-shadow:
        0 8px 20px
        rgba(0,0,0,.35),

        0 0 15px
        rgba(216,180,74,.10);

    transition: .25s;
}


.next-button:hover {

    background:
        linear-gradient(
            135deg,
            #f0d477,
            #c49a35
        );

    transform:
        translateY(-3px);

    box-shadow:
        0 12px 25px
        rgba(0,0,0,.4);
}


.next-button:active {

    transform:
        translateY(1px);
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    html,
    body {

        width: 100%;
        height: 100%;

        overflow: hidden;
    }


    body {

        background:
            radial-gradient(
                circle at 50% 0%,
                rgba(216,180,74,.14),
                transparent 35%
            ),

            linear-gradient(
                160deg,
                #030303,
                #0b0b0b 55%,
                #251b07
            );
    }


    .page {

        width: 100vw;
        height: 100dvh;

        padding: 0;

        display: block;
    }


    /* =================================================
       MOBILE FRAME
    ================================================= */

    .birthday-card {

        position: fixed;

        inset: 0;

        width: 100vw;
        height: 100dvh;

        min-height: 0;

        border-radius: 0;

        border: none;

        box-shadow: none;

        overflow-y: auto;
        overflow-x: hidden;
    }


    .birthday-card::before {

        inset: 8px;

        border-radius: 15px;
    }


    /* =================================================
       NAV
    ================================================= */

    .top-nav {

        height: 62px;

        gap: 15px;

        padding:
            0 18px 0 70px;
    }


    .page-number {

        left: 20px;

        top: 17px;

        padding:
            6px 10px;

        font-size: 9px;
    }


    .nav-link {

        font-size: 8px;
    }


    .menu-button {

        font-size: 18px;
    }


    /* =================================================
       CONTENT
    ================================================= */

    .content {

        height:
            calc(100dvh - 62px);

        min-height: 0;

        padding:
            45px 22px 120px;

        justify-content:
            flex-start;
    }


    /* =================================================
       HEADER
    ================================================= */

    .header-line {

        width: 50px;

        margin-bottom: 15px;
    }


    .happy {

        font-size:
            clamp(54px, 16vw, 68px);

        letter-spacing:
            -2px;
    }


    .birthday {

        font-size:
            clamp(48px, 14vw, 62px);

        letter-spacing:
            -2px;

        margin-top: 11px;
    }


    .underline {

        width: 55px;

        height: 3px;

        margin-top: 12px;
    }


    /* =================================================
       CORNERS
    ================================================= */

    .corner-left {

        left: 25px;

        top: 115px;

        font-size: 18px;
    }


    .corner-right {

        right: 25px;

        top: 112px;

        font-size: 14px;
    }


    /* =================================================
       NAME
    ================================================= */

    .name-label {

        width: 260px;

        min-height: 48px;

        margin-top: 24px;

        font-size: 25px;
    }


    /* =================================================
       MESSAGE
    ================================================= */

    .message {

        width: 100%;

        max-width: 330px;

        margin-top: 20px;

        font-size: 12px;

        line-height: 1.65;
    }


    .message::before {

        margin-bottom: 12px;
    }


    /* =================================================
       STICKY
    ================================================= */

    .sticky-note {

        position: relative;

        right: auto;
        top: auto;

        width: 90px;

        height: 100px;

        margin:
            25px auto 0;

        font-size: 11px;

        transform:
            rotate(4deg);
    }


    /* =================================================
       BOTTOM
    ================================================= */

    .bottom-controls {

        position: fixed;

        left: 0;
        bottom: 0;

        height: 90px;

        background:
            linear-gradient(
                180deg,
                rgba(9,9,9,.15),
                #080808
            );

        border-top:
            1px solid
            rgba(218,180,65,.16);
    }


    .next-button {

        width: 145px;

        height: 37px;

        font-size: 9px;
    }


    .gold-dot {
        display: none;
    }
}


/* =====================================================
   SMALL SAMSUNG GALAXY
===================================================== */

@media (max-width: 390px) {

    .top-nav {

        height: 58px;

        padding-left: 63px;

        gap: 10px;
    }


    .page-number {

        left: 15px;

        top: 15px;
    }


    .nav-link {

        font-size: 7px;
    }


    .content {

        height:
            calc(100dvh - 58px);

        padding:
            35px 18px 110px;
    }


    .happy {

        font-size: 52px;
    }


    .birthday {

        font-size: 46px;
    }


    .name-label {

        width: 235px;

        min-height: 44px;

        font-size: 22px;
    }


    .message {

        max-width: 300px;

        font-size: 11px;
    }


    .sticky-note {

        width: 80px;

        height: 90px;

        font-size: 10px;

        margin-top: 20px;
    }


    .bottom-controls {

        height: 82px;
    }


    .next-button {

        width: 135px;

        height: 35px;

        font-size: 8px;
    }
}


/* =====================================================
   VERY SMALL PHONE
===================================================== */

@media (max-width: 340px) {

    .nav-link:nth-child(3) {

        display: none;
    }


    .content {

        padding-left: 15px;
        padding-right: 15px;
    }


    .happy {

        font-size: 47px;
    }


    .birthday {

        font-size: 42px;
    }


    .name-label {

        width: 215px;

        font-size: 20px;
    }


    .message {

        font-size: 10px;

        max-width: 275px;
    }


    .sticky-note {

        width: 72px;

        height: 82px;

        font-size: 9px;
    }
}

</style>

</head>


<body>


<div class="page">


    <!-- =================================================
         MAIN CARD
    ================================================== -->

    <div class="birthday-card">


        <!-- DECORATION -->

        <div class="gold-dot dot-1"></div>
        <div class="gold-dot dot-2"></div>
        <div class="gold-dot dot-3"></div>
        <div class="gold-dot dot-4"></div>


        <!-- =================================================
             NAVIGATION
        ================================================== -->

        <nav class="top-nav">


          

            <a
                href="awal.html"
                class="nav-link">

                Home

            </a>


            <a
                href="3.html"
                class="nav-link">

                Message

            </a>


            <a
                href="6.html"
                class="nav-link">

                Surprise

            </a>

        </nav>



        <!-- =================================================
             CONTENT
        ================================================== -->

        <div class="content">


            <!-- HEADER LINE -->

            <div class="header-line"></div>


            <!-- DECORATIVE CORNERS -->

            <div class="corner corner-left">
                *
            </div>

            <div class="corner corner-right">
                +
            </div>


            <!-- =================================================
                 TITLE
            ================================================== -->

            <div class="title">


                <div class="happy">
                    Happy
                </div>


                <div class="birthday">
                    Birthday!
                </div>


                <div class="underline"></div>


            </div>



            <!-- =================================================
                 NAME
            ================================================== -->

            <div class="name-label">

                Ivan Ramadan

            </div>



            <!-- =================================================
                 MESSAGE
            ================================================== -->

            <div class="message">

                Semoga di umur yang baru ini,

                <br>

                banyak hal baik yang datang, selalu sehat,

                <br>

                dilancarkan semua urusan, dan makin dekat

                <br>

                sama hal-hal yang kamu impikan.

            </div>



            <!-- =================================================
                 STICKY NOTE
            ================================================== -->

            <div class="sticky-note">

                <div>

                    A

                    <br>

                    Special

                    <br>

                    Day!

                </div>

            </div>


        </div>



        <!-- =================================================
             BOTTOM
             TANPA FOTO
        ================================================== -->

        <div class="bottom-controls">


            <button
                type="button"
                class="next-button"
                onclick="nextPage()">

                NEXT →

            </button>


        </div>


    </div>

</div>



<script>

/* =====================================================
   NEXT PAGE
===================================================== */

function nextPage() {

    window.location.href = "3.html";

}

</script>


</body>

</html>
